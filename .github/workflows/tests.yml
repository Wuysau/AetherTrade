name: Tests

on:
  push:
    branches: [public-snapshot]
  pull_request:
    branches: [public-snapshot]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      # The PAPER engine's mandatory PostgreSQL cases run in the required
      # postgres-paper job below; they fail rather than silently skip without DB.
      - run: >-
          python -m pytest -q
          --ignore=tests/integration/test_paper_engine_postgres.py
          --ignore=tests/integration/test_unified_paper_runtime.py
          --ignore=tests/integration/test_unified_runtime_faults.py
          --ignore=tests/integration/test_unified_console_contract.py
          -m 'not paper_runtime'

  postgres-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: paper_admin
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: paper_ci_admin
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U paper_admin -d paper_ci_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PAPER_CI_ISOLATED: 'YES'
      PAPER_CI_MARKER: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Mark fresh disposable cluster
        env:
          PAPER_CI_ADMIN_DSN: postgresql://paper_admin:synthetic-ci-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/paper_ci_admin
        run: python tools/ci_paper_postgres.py --initialize
      - name: Run required PostgreSQL safety suites
        env:
          PAPER_CI_ADMIN_DSN: postgresql://paper_admin:synthetic-ci-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/paper_ci_admin
        run: python tools/ci_paper_postgres.py --evidence-dir .runtime/paper-pg-ci
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-postgres-${{ github.sha }}
          path: .runtime/paper-pg-ci/
          include-hidden-files: true

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test
