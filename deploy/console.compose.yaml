name: aethertrade-console
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aethertrade
      POSTGRES_DB: aethertrade
      POSTGRES_PASSWORD: ${AETHERTRADE_POSTGRES_PASSWORD:?Use scripts/start-console.ps1 to generate local database settings}
    ports:
      - "127.0.0.1:${AETHERTRADE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - console-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  console-postgres:
