{
  "name": "ip32-offline",
  "services": {
    "execution-owner": {
      "image": "${IP32_OWNER_IMAGE:?reviewed offline image digest required}",
      "user": "10001:10001",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "restart": "no",
      "pids_limit": 64,
      "mem_limit": "256m",
      "cpus": "1.0",
      "command": [
        "python",
        "-c",
        "raise SystemExit('OFFLINE_TEMPLATE: runtime binding not configured')"
      ],
      "environment": {
        "TRADING_ENVIRONMENT": "PAPER",
        "LIVE_ENABLED": "false",
        "PYTHONDONTWRITEBYTECODE": "1"
      },
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,nodev,size=16m"
      ],
      "volumes": [
        {
          "type": "volume",
          "source": "owner-state",
          "target": "/state/owner-state",
          "volume": {
            "nocopy": true
          }
        }
      ],
      "networks": [
        "owner",
        "ledger",
        "cache"
      ]
    },
